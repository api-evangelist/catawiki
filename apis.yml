name: Catawiki
description: 'Catawiki is an online auction marketplace headquartered in Amsterdam,
  Netherlands, specializing in special and collectible objects. Founded in 2008, it
  runs curated weekly auctions across categories such as art, jewelry, watches, classic
  cars, coins, stamps, comics, wine, and other collectibles, where every lot is reviewed
  and vetted by in-house experts before it goes live. Catawiki operates as a consumer
  marketplace connecting buyers and sellers internationally; it does not publish a
  public developer API or partner integration program, and runs its engineering on
  a Ruby/Go/Kafka stack visible across its public GitHub organization. This profile
  was added to the API Evangelist network as a venture-portfolio lead (Accel, Northzone)
  and enriched with verifiable identity and domain-security signals.'
